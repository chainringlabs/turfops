# @spec DEPLOY-CI-009
# osv-scanner configuration
# Per https://google.github.io/osv-scanner/configuration/, this file applies
# only to lockfiles in the same directory (backend/Cargo.lock), which is
# exactly the scope we want.
#
# An advisory may be ignored only while its crate is in Cargo.lock, with a comment line
#   # <ID> (crate <name>): <why it does not apply>
# directly above its entry. `deployment_tests::an_advisory_is_ignored_only_while_its_crate_is_locked`
# enforces this. Every advisory ignored in /backend/deny.toml is also listed here.

# RUSTSEC-2026-0459 (crate libsqlite3-sys): the bundled SQLite before 3.54.0 can return
# uninitialized page-cache memory when a database file is opened together with a crafted
# sibling `-wal` file. The crate reaches Cargo.lock only through sqlx 0.9's optional
# `sqlx-sqlite` driver, which this build never enables: `cargo tree -e all -i libsqlite3-sys`
# prints nothing, so no SQLite is compiled into the binary and the app opens no SQLite files
# (PostgreSQL only). sqlx-sqlite 0.9.0 pins libsqlite3-sys < 0.38 and no later sqlx release
# exists, so the lockfile cannot carry the fixed 0.39. Drop this once sqlx accepts 0.39+.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys is an optional sqlx-sqlite dependency this build never compiles (PostgreSQL only); sqlx 0.9.0 pins it below the fixed 0.39"

# RUSTSEC-2026-0543 (crate chrono): an "unmaintained" notice, not a vulnerability: no flaw
# is reported in any version and there is no fixed version to move to. Moving this code to
# another date library would not take chrono out of Cargo.lock, because rmcp and arrow
# (through duckdb) depend on it unconditionally. Drop this, and plan the move off chrono,
# once rmcp and arrow no longer require it; reassess at once if a vulnerability is filed
# against chrono (it gets its own ID, which this entry does not cover).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "Unmaintained notice with no known vulnerability; rmcp and arrow (via duckdb) hard-depend on chrono, so it cannot leave the lockfile yet"

# RUSTSEC-2026-0555 (crate chrono-tz): an "unmaintained" notice, not a vulnerability: no
# flaw is reported in any version and there is no fixed version. The app uses it only to
# resolve `TZ` into the clock's zone, from the zone database compiled into the binary.
# It leaves together with chrono (see RUSTSEC-2026-0543); reassess at once if a
# vulnerability is filed against chrono-tz.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0555"
reason = "Unmaintained notice with no known vulnerability; resolves TZ for the app clock and leaves together with chrono"
