# @spec DEPLOY-CI-006
name: GHCR retention

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions: {}

jobs:
  prune:
    permissions:
      packages: write
    # The shared workflow always deletes untagged manifests; the two inputs
    # below are the part of the policy this repository states for itself.
    uses: chainringlabs/ci/.github/workflows/ghcr-retention.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
    with:
      keep-n-tagged: 5
      exclude-tags: latest
