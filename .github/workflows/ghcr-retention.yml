# @spec DEPLOY-CI-006
name: GHCR retention

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions: {}

jobs:
  prune:
    permissions:
      packages: write
    # The shared workflow always deletes untagged manifests; the two inputs
    # below are the part of the policy this repository states for itself.
    uses: chainringlabs/ci/.github/workflows/ghcr-retention.yml@0ef8076a7f4b6db0401731b8d8cd5794ebb9b1fc # v1.0.0
    with:
      keep-n-tagged: 5
      exclude-tags: latest
