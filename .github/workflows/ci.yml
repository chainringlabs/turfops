# @spec DEPLOY-CI-001
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the `db-tests` suite; trust auth, reachable only from this job.
      postgres:
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      # rust-cache's save-time cleanup strips the files out of libduckdb-sys's
      # shared source tree (target/duckdb-sources/<hash>/) but leaves the empty
      # directories, so the next rebuild of libduckdb-sys fails its rename with
      # "Directory not empty". Unpacking again takes seconds. Remove once
      # https://github.com/duckdb/duckdb-rs/issues/935 is fixed upstream.
      - name: Remove DuckDB sources emptied by rust-cache
        run: rm -rf backend/target/duckdb-sources

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Lint with Clippy
        working-directory: backend
        run: cargo clippy -- -D warnings

      - name: Run tests (including PostgreSQL-backed tests)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --features db-tests

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @spec UI-BUILD-007
      - name: Type check
        run: npx tsc -b

      # @spec UI-BUILD-006
      - name: Lint
        run: npm run lint

      # @spec UI-BUILD-009
      - name: Test
        run: npm test

  # @spec DEPLOY-CI-002
  supply-chain:
    name: Supply chain
    uses: ./.github/workflows/supply-chain.yml
    secrets: inherit
