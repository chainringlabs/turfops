# @spec DEPLOY-CI-004, DEPLOY-CI-005
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
    with:
      npm-dir: frontend
      cargo-dir: backend
      socket-dir: frontend
      node-version: "26"
      cargo-deny: true
    secrets: inherit

  # The organization's shared publish workflow: builds on pull requests
  # without pushing; otherwise pushes to GHCR (latest, semver, sha), signs
  # with cosign and attaches an SPDX SBOM and build provenance.
  image:
    needs: supply-chain
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
